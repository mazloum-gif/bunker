services:
  - type: web
    name: bunker
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: bunker-data
      mountPath: /var/data
      sizeGB: 1
